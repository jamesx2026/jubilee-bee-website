<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found — Jubilee Bee</title>
<meta name="description" content="The page you were looking for has moved. Browse claw machine rentals for weddings and events across British Columbia." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#4C433A" />

<link rel="canonical" href="https://jubileebee.ca/404" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" />

<style>
  :root {
    --mocha: #6E6155;
    --mocha-deep: #4C433A;
    --taupe: #A2968A;
    --cream: #FAF5EE;
    --ivory: #FFFCF7;
    --sand: #F1E8DC;
    --blush: #E7D2C7;
    --rose: #C08E7E;
    --champagne: #C2A268;
    --gold-deep: #A6853F;
    --line: #E4D8CA;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--mocha-deep);
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    background-image:
      radial-gradient(circle at 18% 12%, rgba(226, 210, 194, 0.45), transparent 42%),
      radial-gradient(circle at 84% 88%, rgba(240, 232, 220, 0.6), transparent 46%);
  }

  .card {
    max-width: 620px;
    width: 100%;
    text-align: center;
    background: var(--ivory);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 56px 40px;
    box-shadow: 0 18px 48px rgba(76, 67, 58, 0.07);
  }

  .mark {
    font-family: 'Pinyon Script', cursive;
    font-size: 2.1rem;
    color: var(--gold-deep);
    line-height: 1;
    margin-bottom: 18px;
  }

  .code {
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 400;
    font-size: 0.76rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--taupe);
    margin: 0 0 14px;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.3rem, 6vw, 3.4rem);
    line-height: 1.12;
    margin: 0 0 18px;
    color: var(--mocha-deep);
  }

  .lede {
    font-size: 1.02rem;
    line-height: 1.75;
    color: var(--mocha);
    margin: 0 auto 30px;
    max-width: 44ch;
  }

  .rule {
    width: 62px;
    height: 1px;
    background: var(--champagne);
    margin: 0 auto 30px;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    display: inline-block;
    padding: 13px 26px;
    border-radius: var(--radius);
    font-size: 0.82rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }

  .btn-primary {
    background: var(--mocha-deep);
    color: var(--cream);
    border: 1px solid var(--mocha-deep);
  }

  .btn-primary:hover {
    background: var(--gold-deep);
    border-color: var(--gold-deep);
    color: #fff;
  }

  .btn-line {
    background: transparent;
    color: var(--mocha-deep);
    border: 1px solid var(--line);
  }

  .btn-line:hover {
    border-color: var(--champagne);
    color: var(--gold-deep);
  }

  .foot {
    margin-top: 34px;
    font-size: 0.82rem;
    color: var(--taupe);
  }

  .foot a { color: var(--mocha); }

  @media (max-width: 520px) {
    .card { padding: 42px 24px; }
    .actions { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">Jubilee Bee</div>
    <p class="code">Error 404</p>
    <h1>This page has flown the hive</h1>
    <div class="rule"></div>
    <p class="lede">
      The page you were looking for has moved or never existed. Let us point you
      back to the good stuff.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-line" href="/#packages">See packages</a>
      <a class="btn btn-line" href="/#contact">Request a quote</a>
    </div>
    <p class="foot">Vancouver & across British Columbia</p>
  </main>
</body>
</html>
